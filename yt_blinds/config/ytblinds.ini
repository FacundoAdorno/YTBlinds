[GENERAL]
locale = es_ES
win_height = 800
win_width = 650

[STYLES]
bg_color = #000000
fg_color = #FFFFFF
accent_color = #FFFF00
select_color = #333333

[DATA]
# Path relative to the app files directory
db_relativepath_dir = data/
db_path_filename = ytblinds_data.db
download_path_video = ~/Descargas
download_path_audio = ~/Descargas

[SEARCH]
max_results_displayed = 40

[ACCESSIBILITY]
# rates --> 140: slow,  170: medium,    190: fast
pyttsx3.voice.rate = 170
# volume is a float value between 0.0 and 1.0
pyttsx3.voice.volume = 1.0
# Establece la longitud máxima de carácteres a ser leídos al leer metadato Descripción.
# Un valor de 0 deshabilita la lectura.
detailed_video.description.max_chars_read = 300
