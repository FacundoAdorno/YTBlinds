[GENERAL]
locale = es_ES
win_height = 650
win_width = 800

[STYLES]
bg_color = #000000
fg_color = #FFFFFF
accent_color = #FFFF00
select_color = #333333

[DATA]
# Path relative to the app files directory
db_relativepath_dir = data/
db_path_filename = ytblinds_data.db
download_path_video = ~/Descargas/ytblinds_descargas/videos
download_path_audio = ~/Descargas/ytblinds_descargas/audios

[YTDLP]
max_results_displayed = 40
# Coeficiente en gigabytes (GB) del tamaño máximo de descarga que se descargará sin pedir afirmación.
# Por ejemplo: 0.5 equivale a 0.5GB=500MB; 2 equivale a 2GB=2048MB; etc.
download_size_before_confirm = 0.5

[ACCESSIBILITY]
# rates --> 140: slow,  170: medium,    190: fast
pyttsx3.voice.rate = 170
# volume is a float value between 0.0 and 1.0
pyttsx3.voice.volume = 1.0
# Establece la longitud máxima de carácteres a ser leídos al leer metadato Descripción.
# Un valor de 0 deshabilita la lectura.
detailed_video.description.max_chars_read = 300
